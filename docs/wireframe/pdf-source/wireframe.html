<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pin it! Wireframe v1.1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 4px base scale. UI gray only; the one in-UI color is the 협찬·광고 label (product's core promise). Blue = annotation layer. */
:root{--ink:#141414;--g1:#5c5c5c;--g2:#9a9a9a;--g3:#d6d6d6;--g4:#ececec;--g5:#f6f6f6;--ad:#e8432e;--note:#2456e6;--paper:#fbfbf9}
@page{size:780px 900px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--paper);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.mono{font-family:"JetBrains Mono",Consolas,monospace}
.page{width:780px;height:900px;padding:32px 40px;display:flex;flex-direction:column;page-break-after:always;overflow:hidden}
.hdr{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:20px;font-size:11px}
.hdr b{font-size:16px;font-family:Pretendard,sans-serif;font-weight:700;letter-spacing:-.2px}
.row{display:flex;gap:36px}
/* Galaxy S26 frame: 360x780 dp viewport */
.phone{width:376px;height:796px;border:8px solid #1d1d1d;border-radius:36px;background:#fff;overflow:hidden;flex:none;position:relative}
.scr{position:relative;width:360px;height:780px;display:flex;flex-direction:column;font-size:14px}
.scr *{position:relative}
.scr .m{position:absolute;top:-6px;right:4px;width:18px;height:18px;border-radius:9px;background:var(--note);color:#fff;font:600 10px/18px "JetBrains Mono",monospace;text-align:center;z-index:9}
.scr .abs{position:absolute}
.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;font-weight:600;flex:none}
.sb::after{content:"";position:absolute;left:174px;top:8px;width:12px;height:12px;border-radius:6px;background:#1d1d1d}
.gn{height:20px;flex:none;display:flex;justify-content:center;align-items:center;background:#fff}
.gn::before{content:"";width:108px;height:4px;border-radius:2px;background:var(--ink)}
.body{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* bottom tab bar */
.nav{height:64px;flex:none;display:flex;border-top:1px solid var(--g4);background:#fff}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--g2);font-weight:600}
.nav .on{color:var(--ink)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .on svg{stroke-width:2.2}
/* sticky bottom action bar for detail/form screens */
.cta{flex:none;display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--g4);background:#fff}
.ab{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--g4);font-weight:700;font-size:16px;flex:none}
.ab .ic{font-weight:400;font-size:20px;width:24px}
.ab .sp{flex:1}
.pad{padding:16px}
.lbl{font-size:12px;color:var(--g1);margin-bottom:4px;font-weight:600}
.inp{height:48px;border:1px solid var(--g3);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--g2);margin-bottom:12px;background:#fff}
.inp.on{border-color:var(--ink);color:var(--ink)}
.inp .r{margin-left:auto;font-size:12px;color:var(--g1);font-weight:600}
.inp svg{width:18px;height:18px;fill:none;stroke:var(--g1);stroke-width:2;flex:none}
.ta{height:160px;align-items:flex-start;padding-top:12px}
.help{font-size:11px;color:var(--g1);margin:-8px 0 12px}
.btn{height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--ink);color:#fff}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.off{background:var(--g4);color:var(--g2)}
.btn.s{height:36px;font-size:13px;padding:0 12px}
.link{color:var(--ink);text-decoration:underline;font-size:13px}
.hr{height:8px;background:var(--g5);flex:none}
.chip{display:inline-flex;height:36px;align-items:center;padding:0 14px;border:1px solid var(--g3);border-radius:18px;font-size:13px;background:#fff;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dash{border:1px dashed var(--g2)!important}
.badge{display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--g4);color:var(--g1);font-weight:600;white-space:nowrap}
.badge.k{background:var(--ink);color:#fff}
.ad{display:inline-block;white-space:nowrap;font-size:15px;font-weight:800;color:var(--ad);border:1.5px solid var(--ad);border-radius:4px;padding:1px 6px;margin-bottom:6px}
.banner{background:var(--g5);border-left:3px solid var(--ink);padding:12px;font-size:13px;margin-bottom:12px}
.toast{position:absolute!important;left:16px;right:16px;background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;font-size:13px;z-index:7;display:flex;justify-content:space-between}
.map{background:#eceae4;overflow:hidden;flex:none}
.map::before{content:"";position:absolute;inset:0;background:
 linear-gradient(28deg,transparent 46%,#fff 46%,#fff 50%,transparent 50%),
 linear-gradient(-62deg,transparent 60%,#fff 60%,#fff 63%,transparent 63%),
 repeating-linear-gradient(90deg,transparent 0 58px,#f7f6f2 58px 62px),
 repeating-linear-gradient(0deg,transparent 0 70px,#f7f6f2 70px 74px)}
.map .osm{position:absolute;right:4px;bottom:4px;font-size:8px;background:rgba(255,255,255,.85);padding:1px 4px;color:var(--g1)}
.pin{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);border:2px solid #fff}
.pin.g{background:var(--g2)}
.pin.big{width:30px;height:30px}
.me{position:absolute;width:16px;height:16px;border-radius:8px;background:var(--note);border:3px solid #fff;box-shadow:0 0 0 6px rgba(36,86,230,.18)}
.fab{position:absolute;width:48px;height:48px;border-radius:24px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.fab svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2}
.li{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--g4);align-items:center}
.li .t{font-weight:700}
.li .s{font-size:12px;color:var(--g1);margin-top:2px}
.li .chev{color:var(--g2)}
.thumb{width:48px;height:48px;border-radius:6px;background:var(--g4);flex:none}
.fl{flex:1;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--g3);flex:none}
.tabs div{flex:1;text-align:center;padding:12px 0;color:var(--g2);font-weight:600}
.tabs .on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.dim{position:absolute!important;inset:0;background:rgba(0,0,0,.45);z-index:5}
.sheet{position:absolute!important;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:6;padding:8px 16px 16px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--g3);margin:0 auto 12px}
.opt{display:flex;align-items:center;gap:12px;height:48px;border-bottom:1px solid var(--g4)}
.rd{width:20px;height:20px;border-radius:10px;border:2px solid var(--g2);flex:none}
.rd.on{border:6px solid var(--ink)}
.cb{width:20px;height:20px;border-radius:4px;border:2px solid var(--g2);flex:none}
.cb.on{background:var(--ink);border-color:var(--ink)}
.tg{width:44px;height:24px;border-radius:12px;background:var(--g3);flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff}
.tg.on{background:var(--ink)}.tg.on::after{left:22px}
.rv{padding:16px;border-bottom:1px solid var(--g4)}
.rv .who{display:flex;justify-content:space-between;font-size:12px;color:var(--g1);margin-bottom:8px}
.rv p{font-size:13px;line-height:1.5}
.ph{display:flex;gap:6px;margin-top:8px}.ph i{width:56px;height:56px;background:var(--g4);border-radius:4px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px}
.empty .ill{width:64px;height:64px;border-radius:32px;border:2px dashed var(--g2);margin-bottom:8px}
.demo{height:20px;flex:none;background:var(--g5);font-size:10px;color:var(--g1);display:flex;align-items:center;justify-content:center;border-top:1px solid var(--g4)}
.kb{height:260px;flex:none;background:#e9e9ec;display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:10px 6px;align-content:start}
.kb i{height:40px;background:#fff;border-radius:5px}
.chk{font-size:12px;color:var(--g1);display:flex;gap:12px;margin:-6px 0 12px}
.chk span::before{content:"✓ ";font-weight:800}
.chk .ok{color:var(--ink);font-weight:600}
/* notes column */
.notes{flex:1;font-size:12.5px;line-height:1.55}
.notes .meta{font-size:10.5px;color:var(--g1);margin-bottom:16px;line-height:1.7}
.notes ol{list-style:none}
.notes li{display:flex;gap:10px;margin-bottom:12px}
.notes li b{flex:none;width:18px;height:18px;border-radius:9px;background:var(--note);color:#fff;font:600 10px/18px "JetBrains Mono",monospace;text-align:center;margin-top:1px}
.notes h4{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--g1);font-weight:600;margin:20px 0 8px;letter-spacing:.5px}
.notes .ex{font-size:12px;color:var(--g1);border-left:2px solid var(--g3);padding-left:10px;margin-bottom:6px}
.notes .ux{font-size:12px;border-left:2px solid var(--note);padding-left:10px;margin-bottom:6px}
.tag{font-family:"JetBrains Mono",monospace;font-size:10px;border:1px solid var(--ink);padding:1px 5px;border-radius:3px;margin-right:4px}
/* cover */
.cover h1{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
.cover h2{font-size:18px;font-weight:500;margin-top:12px;color:var(--g1)}
.cover table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.cover td{padding:6px 0;border-bottom:1px solid var(--g4);vertical-align:top}
.cover td:first-child{font-family:"JetBrains Mono",monospace;width:84px;font-size:11px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.flow span{border:1px solid var(--ink);padding:6px 10px;border-radius:4px;background:#fff}
.flow em{font-style:normal;color:var(--g2)}
.sec{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--g1);margin:18px 0 4px;letter-spacing:.5px}
</style>
</head>
<body>
<div id="out"></div>
<script>
const m=(n,s='')=>`<b class="m" style="${s}">${n}</b>`;
const SB=`<div class="sb mono"><span>9:41</span><span>LTE ▮▮▮ 100%</span></div>`;
const GN=`<div class="gn"></div>`;
const IC={
 홈:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 리스트:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',

 '내 정보':'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'};

const searchBar=(q,mk='')=>`<div class="ab" style="gap:8px"><span class="ic">←</span><div class="inp on" style="flex:1;margin:0;height:40px;font-weight:400;font-size:14px">${SRCH}${q}<span class="r" style="font-size:16px;color:var(--g2)">✕</span></div>${mk}</div>`;
const review=(who,body,{adv=0,photos=0,mk=''}={})=>`<div class="rv"><div class="who"><span>${who} · 11.02</span><span style="font-size:16px;color:var(--ink);padding:0 4px">⋮${mk}</span></div>${adv?`<span class="ad">협찬·광고</span>`:''}<p>${body}</p>${photos?`<div class="ph">${'<i></i>'.repeat(photos)}</div>`:''}</div>`;
const pinDetailTop=()=>`${ab('',{right:'<span style="font-size:13px;font-weight:600">공유</span>'})}
 ${map(120,pin(165,40,'big'))}
 <div class="pad" style="padding-bottom:12px"><div style="display:flex;gap:6px;margin-bottom:6px"><span class="badge">장소 연결</span><span class="badge">카페</span></div>
 <div style="font-size:20px;font-weight:800">카페 B</div>
 <div style="font-size:12px;color:var(--g1);margin-top:2px">작성자 jiyul · <span class="link" style="font-size:12px">카카오맵에서 보기</span></div>
 <p style="font-size:13px;margin-top:10px;line-height:1.5">2층 창가 자리가 조용해요. 주말 오후엔 웨이팅 있어요.</p></div>`;
const pinCTA=(mk='')=>`<div class="cta"><div class="btn o" style="width:104px">♡ 찜 8${mk}</div><div class="btn" style="flex:1">리뷰 쓰기</div></div>`;
const kb=`<div class="kb">${'<i></i>'.repeat(30)}</div>`;

const S=[
{id:'S-01',name:'로그인',grp:'계정',html:`${ab('',{back:0,right:'<span style="font-size:20px;font-weight:400">✕</span>'})}
 <div class="pad" style="padding-top:40px"><div style="font-size:36px;font-weight:800;letter-spacing:-1px">Pin it!</div><div style="color:var(--g1);font-size:13px;margin:4px 0 36px">광고 여부가 보이는 리뷰와 위치 핀</div>
 <div class="lbl">이메일</div><div class="inp">name@example.com${m(1)}</div>
 <div class="lbl">비밀번호</div><div class="inp">••••••••<span class="r">보기</span>${m(2)}</div>
 <div style="font-size:12px;color:var(--ink);margin:-4px 0 16px">이메일 또는 비밀번호가 맞지 않아요.${m(3)}</div>
 <div class="btn">로그인</div>
 <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--g1)">처음이에요? <span class="link">회원가입</span>${m(4)}</div></div>`,
 notes:['이메일 칸은 이메일 키보드(@ 자판), 자동완성 허용.','비밀번호 "보기" 토글 — 오타 확인용.','오류는 입력칸 아래 문구로 안내. 입력값은 지우지 않아요.','회원가입(S-02)으로 이동.'],
 ux:['✕ 닫기: 둘러보다 들어온 경우 원래 화면으로 바로 돌아감 (비로그인도 지도·검색은 이용 가능)'],
 ex:['핀 찍기·찜·리뷰·신고에서 비로그인 → 이 화면, 로그인 뒤 원래 화면 복귀','이메일 미인증 → 다음 장']},
{id:'S-01',name:'로그인 · 이메일 미인증',grp:'계정 / 예외',html:`${ab('',{back:0,right:'<span style="font-size:20px;font-weight:400">✕</span>'})}
 <div class="pad" style="padding-top:40px"><div style="font-size:36px;font-weight:800;letter-spacing:-1px">Pin it!</div><div style="color:var(--g1);font-size:13px;margin:4px 0 36px">광고 여부가 보이는 리뷰와 위치 핀</div>
 <div class="banner"><b>인증 메일을 확인해 주세요</b><div style="margin-top:4px;color:var(--g1);font-size:12px">jiyul@example.com 메일의 링크를 누르면 로그인할 수 있어요.</div><div class="btn o s" style="margin-top:10px;width:160px">인증 메일 다시 보내기</div>${m(1)}</div>
 <div class="lbl">이메일</div><div class="inp on">jiyul@example.com</div>
 <div class="lbl">비밀번호</div><div class="inp on">••••••••<span class="r">보기</span></div>
 <div class="btn">로그인</div></div>`,
 notes:['인증 전에는 로그인 불가 (Confirm email 켬). 어느 주소로 보냈는지 함께 보여 줌.'],ex:['재발송 후 60초간 버튼 비활성 + 남은 시간 표시 (메일 발송 한도 낮음)']},
{id:'S-02',name:'회원가입',grp:'계정',html:`${ab('회원가입')}
 <div class="pad" style="padding-top:24px">
 <div class="lbl">이메일</div><div class="inp on">jiyul@example.com${m(1)}</div>
 <div class="lbl">비밀번호</div><div class="inp on">••••••<span class="r">보기</span></div>
 <div class="chk"><span>8자 이상</span><span class="ok">영문·숫자 포함</span>${m(2)}</div>
 <div class="btn off" style="margin-top:24px">가입하기${m(3)}</div>
 <div style="margin-top:32px;border-top:1px solid var(--g4);padding-top:24px">
  <div class="lbl" style="font-family:'JetBrains Mono',monospace;color:var(--g2)">제출 후 상태</div>
  <div class="banner" style="margin-top:8px"><b>인증 메일을 보냈어요</b><div style="margin-top:4px;font-size:12px;color:var(--g1)">jiyul@example.com 메일함을 확인해 주세요.</div>${m(4)}</div>
  <div class="btn o">로그인으로 가기</div></div></div>`,
 notes:['이메일·비밀번호만. 소셜 로그인 없음(Won\'t).','비밀번호 규칙을 체크리스트로 실시간 표시 — 충족하면 진하게 바뀜. 제출 후에 틀렸다고 알리는 것보다 빠름.','규칙을 다 채우기 전엔 가입 버튼 비활성.','이미 가입된 이메일도 똑같이 "인증 메일을 보냈어요" → 계정 존재를 드러내지 않아요.']},
{id:'S-03',name:'내 정보',grp:'계정 · 탭',nav:'내 정보',html:`${ab('내 정보',{back:0})}
 <div class="pad"><div class="lbl">가입 이메일</div><div style="font-size:16px;font-weight:700;margin-bottom:8px">jiyul@example.com${m(1)}</div></div>
 <div class="hr"></div>
 <div class="li"><div class="fl t">내가 찍은 핀</div><span class="s" style="font-size:12px;color:var(--g1)">4</span><span class="chev">›</span></div>
 <div class="li"><div class="fl t">내가 쓴 리뷰</div><span class="s" style="font-size:12px;color:var(--g1)">7</span><span class="chev">›</span>${m(2)}</div>
 <div class="li dash" style="margin:8px 16px;border-radius:8px"><div class="fl"><div class="t">리뷰 검토</div><div class="s">운영자 계정에만 보여요</div></div><span class="chev">›</span>${m(3)}</div>
