<head>

<title>S-09 리뷰 작성 · Pin it! 와이어프레임</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="phone"><div class="scr">
  <div class="ab"><a class="ic" href="s07-pin.html" aria-label="뒤로">←</a><span class="sp">리뷰 쓰기</span><a class="act" href="s07-pin.html">취소</a></div>
  <div class="body pad">
    <div style="font-size:12px;color:var(--g1);margin-bottom:12px">카페 B</div>
    <div class="inp ta" style="height:130px;padding-top:12px;color:var(--g2)">방문 경험을 적어 주세요.</div>
    <div class="count">0 / 1000</div>
    <div class="opt" style="border:1px solid var(--ink);border-radius:8px;padding:8px 12px">
      <span class="cb on"></span>
      <div class="fl"><b>협찬·대가를 받았어요</b><div style="font-size:11px;color:var(--g1)">리뷰 맨 위에 <span style="color:var(--ad);font-weight:800">협찬·광고</span> 표시가 붙어요.</div></div>
    </div>
    <div class="lbl" style="margin-top:16px">사진 (선택, 최대 3장)</div>
    <div class="photos">
      <div class="slot"><span style="position:absolute;right:4px;top:2px;font-size:12px">✕</span></div>
      <span class="add" style="width:72px;height:72px;border-radius:6px;border:1px dashed var(--g2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--g2);font-size:11px"><span style="font-size:20px">+</span>1/3</span>
    </div>
    <div class="opt" style="border:0"><span class="cb"></span><span style="font-size:13px">직접 찍은 사진이에요 (사진 올릴 때 필수)</span></div>
  </div>
  <div class="cta"><a class="btn" href="s07-pin.html">등록</a></div>
</div></div>
