<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-11 찜하기 · Pin it! 와이어프레임</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="phone"><div class="scr">
  <!-- 배경: S-07 핀 상세 -->
  <div class="ab"><span class="ic">←</span><span class="sp"></span><span class="act">공유</span></div>
  <div class="body">
    <div class="map" style="height:120px"><span class="pin big" style="left:50%;top:70%"></span></div>
    <div class="pad"><div style="font-size:20px;font-weight:800">카페 B</div><p style="font-size:13px;margin-top:10px">2층 창가 자리가 조용해요. 주말 오후엔 웨이팅 있어요.</p></div>
  </div>

  <a class="dim" href="s07-pin.html" aria-label="닫기"></a>
  <div class="sheet">
    <div class="grab"></div>
    <h3 style="margin-bottom:8px">리스트에 담기</h3>
    <div class="opt"><span class="cb on"></span><div class="fl">성수 카페 투어</div><span class="badge k">공개</span></div>
    <div class="opt"><span class="cb on"></span><div class="fl">혼자 가고 싶은 곳</div><span class="badge">비공개</span></div>
    <div class="opt"><span class="cb"></span><div class="fl">산책 벤치</div><span class="badge">비공개</span></div>
    <div style="border:1px dashed var(--g2);border-radius:8px;padding:12px;margin-top:12px">
      <div class="lbl">새 리스트</div>
      <div class="inp" style="height:40px;margin-bottom:8px;color:var(--g2)">리스트 이름</div>
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px"><span>공개 <span style="font-size:11px;color:var(--g1)">· 끄면 나만 봐요</span></span><span class="tg"></span></div>
    </div>
    <a class="btn" href="s07-pin.html" style="margin-top:12px">2개 리스트에 담기</a>
  </div>
</div></div>
<script src="../assets/wire.js"></script>
</body>
</html>
