<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-06 핀 찍기 · Pin it! 와이어프레임</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="phone"><div class="scr">
  <div class="ab"><a class="ic" href="s04-home.html" aria-label="뒤로">←</a><span class="sp">핀 찍기</span><a class="act" href="s04-home.html">취소</a></div>
  <div class="body">
    <div class="map" style="height:230px">
      <span class="pin g" style="left:18%;top:30%"></span>
      <span class="pin g" style="left:72%;top:78%"></span>
      <span class="pin big sel" style="left:50%;top:58%"></span>
      <div class="float" style="left:16px;right:16px;top:10px;background:rgba(20,20,20,.85);color:#fff;font-size:12px;padding:8px 12px;border-radius:6px">지도를 길게 눌러 위치를 정하세요. 핀은 끌어서 옮길 수 있어요.</div>
      <span class="osm">© OpenStreetMap contributors</span>
    </div>
    <div class="pad">
      <div class="lbl">핀 이름 (필수)</div>
      <div class="inp" style="color:var(--g2)">예: 노을 보는 벤치<span class="r" style="margin-left:auto;color:var(--g2)">0/30</span></div>
      <div class="lbl">근처 장소 연결 (선택)</div>
      <div class="opt"><span class="rd on"></span>연결 안 함 · 위치 핀</div>
      <div class="opt"><span class="rd"></span><div class="fl">카페 C <span style="font-size:11px;color:var(--g1)">· 24m</span></div></div>
      <div class="opt" style="border:0"><span class="rd"></span><div class="fl">성수 갤러리 <span style="font-size:11px;color:var(--g1)">· 41m</span></div></div>
    </div>
  </div>
  <div class="cta"><a class="btn" href="s07-pin.html">저장</a></div>
</div></div>
<script src="../assets/wire.js"></script>
</body>
</html>
