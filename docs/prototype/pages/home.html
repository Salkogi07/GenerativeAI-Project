<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pin it! — 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/pages/home.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="phone"><div class="scr" data-nav="홈">
  <div class="top"><span class="brand">Pin it!</span><span class="top-aside"><i data-i="pin" class="xs"></i>성수동</span></div>
  <div class="map fill" id="map">
    <div class="float map-top">
      <a class="search-pill" href="search.html"><i data-i="search"></i>장소, 키워드, 리스트 검색</a>
      <div class="chips" id="chips" role="radiogroup" aria-label="카테고리"></div>
      <div class="mine-bar" id="mineBar" hidden><span>내가 찍은 핀만 보는 중</span><a class="text-link" href="home.html">전체 보기</a></div>
    </div>
    <button class="float fab fab-loc" id="loc" aria-label="내 위치로 이동"><i data-i="locate"></i></button>
    <a class="float fab-main fab-pin" id="fab" href="pin-new.html"><i data-i="plus"></i>핀 찍기</a>
    <a class="float preview" id="preview" hidden>
      <span class="pv-head"><span class="thumb tint"><i data-i="pin"></i></span>
        <span class="fl"><span class="pv-name ell" id="pvName"></span><span class="pv-sub" id="pvSub"></span></span>
        <i data-i="chev" class="muted"></i></span>
      <span class="pv-desc" id="pvDesc"></span>
      <span class="pv-rvs" id="pvRvs"></span>
      <span class="pv-by" id="pvBy"></span>
    </a>
  </div>
  <div class="demo-strip">시연용 가상 데이터 · 성수동</div>
</div></div>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/map.js"></script>
<script src="../js/pages/home.js"></script>
</body>
</html>
