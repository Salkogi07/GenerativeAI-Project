<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>핀 찍기 · Pin it!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/pages/pin-new.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="phone"><div class="scr">
  <div class="top line"><button class="icon-btn" data-back="home.html" aria-label="뒤로"><i data-i="back"></i></button><span class="ttl">핀 찍기</span></div>
  <div class="body" data-guard>
    <div class="map h250" id="map">
      <div class="float guide"><i data-i="info" class="sm"></i>지도를 누르거나 길게 눌러 위치를 정하세요. 핀은 끌어서 옮길 수 있어요.</div>
    </div>
    <div class="pad">
      <div class="field"><label for="name">핀 이름</label>
        <div class="control" id="cName"><input id="name" maxlength="30" placeholder="예: 노을 보는 벤치"><span class="aside num" id="nameCount">0/30</span></div>
        <div class="hint bad" id="nameErr"></div></div>
      <div class="field"><span class="label">카테고리</span><div class="chips wrap" id="cats"></div></div>
      <div class="field last"><span class="label">근처 장소 연결 <span class="opt-note">· 선택</span></span><div id="near"></div></div>
    </div>
  </div>
  <div class="cta"><button class="btn" id="save">핀 저장</button></div>
</div></div>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/map.js"></script>
<script src="../js/pages/pin-new.js"></script>
</body>
</html>
