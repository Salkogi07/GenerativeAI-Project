<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리스트 · Pin it!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/pages/list.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="phone"><div class="scr" data-nav="리스트">
  <div class="top"><button class="icon-btn" data-back="lists.html" aria-label="뒤로"><i data-i="back"></i></button><span class="ttl" id="ttl"></span><button class="icon-btn" id="menu" aria-label="리스트 메뉴"><i data-i="more"></i></button></div>
  <div class="body">
    <div class="pad tight-top share-box">
      <button class="check pub-row" id="pubRow" role="switch">
        <span class="fl"><b id="pubT"></b><span class="note" id="pubS"></span></span><span class="switch" id="pub"></span>
      </button>
      <button class="btn copy-btn" id="copy"><i data-i="link" class="sm"></i>공유 링크 복사</button>
      <div class="hint center" id="copyHint" hidden>공개로 바꾸면 링크를 복사할 수 있어요.</div>
    </div>
    <div class="map h180" id="map"></div>
    <div id="rows"></div>
    <div class="empty" id="empty" hidden><span class="ic"><i data-i="pin"></i></span><div class="t">아직 담은 핀이 없어요</div><div class="s">핀 상세에서 하트를 눌러 이 리스트에 담아 보세요.</div><a class="btn fit" href="home.html">지도 둘러보기</a></div>
  </div>
</div></div>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/map.js"></script>
<script src="../js/pages/list.js"></script>
</body>
</html>
